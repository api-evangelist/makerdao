name: MakerDAO
description: >-
  MakerDAO is the decentralized autonomous organization behind the Maker Protocol,
  an Ethereum-based smart-contract system that lets anyone, anywhere generate the
  Dai (DAI) stablecoin by locking crypto collateral into Vaults. The protocol
  governs collateral types, stability fees, the Dai Savings Rate (DSR), collateral
  liquidation auctions, and oracle price feeds through on-chain governance by MKR
  token holders. Rather than a hosted REST API, developers integrate directly with
  the Maker Protocol smart contracts and through the official Dai.js JavaScript /
  TypeScript SDK, the multicall state-management library, and published developer
  guides. MakerDAO has since rebranded to the Sky Ecosystem (USDS / SKY). Surfaced
  as a portfolio company of Paradigm and enriched by the API Evangelist pipeline.
